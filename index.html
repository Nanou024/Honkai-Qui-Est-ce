<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qui est-ce ? Honkai: Star Rail</title>
<style>
  :root {
    --red-bg: #ffe6e6;
    --red-text: #a00000;
    --red-elim: #ffcccc;
    --blue-bg: #e6f0ff;
    --blue-text: #003a9a;
    --blue-elim: #cce0ff;
  }
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    margin: 0; padding: 0;
    background: var(--red-bg);
    color: var(--red-text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  body.blue-theme {
    background: var(--blue-bg);
    color: var(--blue-text);
  }
  h1 {
    margin: 1rem 0 0.5rem;
  }
  #chosen {
    font-weight: bold;
    font-size: 1.3rem;
    margin-bottom: 1rem;
    min-height: 1.5em;
  }
  #controls {
    margin-bottom: 1rem;
  }
  button {
    background-color: transparent;
    border: 2px solid currentColor;
    color: inherit;
    padding: 0.5em 1em;
    margin: 0 0.5em;
    font-size: 1rem;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s, color 0.3s;
  }
  button:hover {
    background-color: currentColor;
    color: white;
  }
  #characters {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(100px,1fr));
    gap: 1rem;
    width: 90vw;
    max-width: 800px;
  }
  .character {
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: filter 0.3s;
  }
  .character img {
    width: 100px;
    height: 100px;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 0 6px rgba(0,0,0,0.1);
    transition: transform 0.3s;
  }
  .character:hover img {
    transform: scale(1.1);
  }
  .character.eliminated {
    filter: grayscale(100%) brightness(0.7);
    cursor: default;
  }
  .character span {
    display: block;
    margin-top: 0.3rem;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<h1>Qui est-ce ? Honkai: Star Rail</h1>
<div id="chosen"></div>
<div id="controls">
  <button id="randomBtn">Choisir un personnage au hasard</button>
  <button id="resetBtn">Réinitialiser</button>
  <button id="themeBtn">Changer thème (Rouge / Bleu)</button>
</div>
<div id="characters">
  <div class="character" data-name="Acheron">
    <img src="images/Acheron.webp" alt="Acheron" />
    <span>Acheron</span>
  </div>
  <div class="character" data-name="Aglae">
    <img src="images/Aglae.webp" alt="Aglae" />
    <span>Aglae</span>
  </div>
  <div class="character" data-name="Anaxa">
    <img src="images/Anaxa.webp" alt="Anaxa" />
    <span>Anaxa</span>
  </div>
  <div class="character" data-name="Argenti">
    <img src="images/Argenti.webp" alt="Argenti" />
    <span>Argenti</span>
  </div>
  <div class="character" data-name="Arlan">
    <img src="images/Arlan.webp" alt="Arlan" />
    <span>Arlan</span>
  </div>
  <div class="character" data-name="Asta">
    <img src="images/Asta.webp" alt="Asta" />
    <span>Asta</span>
  </div>

  </div>
</div>

<script>
  const characters = document.querySelectorAll('.character');
  const chosenDiv = document.getElementById('chosen');
  const randomBtn = document.getElementById('randomBtn');
  const resetBtn = document.getElementById('resetBtn');
  const themeBtn = document.getElementById('themeBtn');
  const body = document.body;

  // Toggle elimination on click
  characters.forEach(char => {
    char.addEventListener('click', () => {
      if (char.classList.contains('eliminated')) {
        char.classList.remove('eliminated');
      } else {
        char.classList.add('eliminated');
      }
    });
  });

  // Choose random character
  randomBtn.addEventListener('click', () => {
    const alive = Array.from(characters).filter(c => !c.classList.contains('eliminated'));
    if (alive.length === 0) {
      alert("Tous les personnages sont éliminés !");
      return;
    }
    const randIndex = Math.floor(Math.random() * alive.length);
    const chosenName = alive[randIndex].dataset.name;
    chosenDiv.textContent = `Personnage choisi : ${chosenName}`;
  });

  // Reset all eliminations and chosen
  resetBtn.addEventListener('click', () => {
    characters.forEach(c => c.classList.remove('eliminated'));
    chosenDiv.textContent = '';
  });

  // Toggle theme red/blue
  themeBtn.addEventListener('click', () => {
    body.classList.toggle('blue-theme');
  });
</script>
</body>
</html>
